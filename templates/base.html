<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}astra{% endblock %}</title>
<style>
  :root {
    --bg: #08090c; --bg2: #0d0f14; --panel: #101319; --card: #12151d;
    --line: #1e2330; --line2: #2a3145;
    --ink: #e8ebf4; --dim: #9aa3ba; --faint: #5c6478;
    --accent: #8ab4ff; --accent2: #b48aff; --ok: #4ade80; --warn: #fbbf24;
    --mono: ui-monospace, 'Cascadia Code', Consolas, 'SF Mono', monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.7 system-ui, 'Segoe UI', sans-serif;
         -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* header */
  .top { border-bottom: 1px solid var(--line); background: rgba(8,9,12,.85);
         backdrop-filter: blur(8px); position: sticky; top: 0; z-index: 10; }
  .top-in { max-width: 980px; margin: 0 auto; padding: 14px 24px;
            display: flex; align-items: center; gap: 24px; }
  .wordmark { font-family: var(--mono); font-size: 17px; font-weight: 700;
              letter-spacing: 4px; color: var(--ink); }
  .wordmark:hover { text-decoration: none; }
  .wordmark .star { color: var(--accent2); margin-right: 8px; }
  .top nav { margin-left: auto; display: flex; gap: 20px; font-size: 13.5px; }
  .top nav a { color: var(--dim); }
  .top nav a:hover { color: var(--ink); text-decoration: none; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 40px 24px 90px; }

  /* shared bits */
  .chip { display: inline-block; background: var(--card); border: 1px solid var(--line);
          border-radius: 99px; padding: 2px 12px; font-size: 12.5px; color: var(--dim);
          font-family: var(--mono); white-space: nowrap; }
  .chip b { color: var(--ink); font-weight: 600; }
  .cmd-block { display: flex; gap: 10px; align-items: stretch; }
  .cmd { flex: 1; background: #05060a; border: 1px solid var(--line2); border-radius: 8px;
         padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; color: var(--ok);
         overflow-x: auto; white-space: nowrap; scrollbar-width: thin; }
  button.copy { background: var(--ink); color: var(--bg); border: 0; border-radius: 8px;
                padding: 0 18px; font-weight: 700; cursor: pointer; font-size: 13.5px;
                transition: background .15s; }
  button.copy:hover { background: var(--accent); }
  .footer { border-top: 1px solid var(--line); margin-top: 80px; }
  .footer-in { max-width: 980px; margin: 0 auto; padding: 24px;
               font-size: 12.5px; color: var(--faint); font-family: var(--mono);
               display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="wordmark" href="/"><span class="star">✦</span>ASTRA</a>
    <nav>
      <a href="/">skills</a>
      <a href="/api/skills">api</a>
      <a href="/skills/astra-publish/1.0.0">publish</a>
    </nav>
  </div>
</header>

<div class="wrap">
{% block content %}{% endblock %}
</div>

<footer class="footer">
  <div class="footer-in">
    <span>✦ astra — agent skill transfer &amp; registry</span>
    <span>curated · versioned · no git required</span>
  </div>
</footer>
<script>
function copyText(btn, id) {
  navigator.clipboard.writeText(document.getElementById(id).textContent).then(() => {
    const old = btn.textContent;
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = old; }, 1600);
  });
}
{% block script %}{% endblock %}
</script>
</body>
</html>
