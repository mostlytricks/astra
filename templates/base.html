<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}astra{% endblock %}</title>
<style>
  :root {
    --bg: #07080b; --bg-elev: #0b0d12;
    --panel: #0e1118; --card: #12151d; --card2: #171b26;
    --line: #1d2230; --line2: #2b3346; --line3: #38414f;
    --ink: #eef1f8; --dim: #9aa3ba; --faint: #5c6478; --mute: #3f4658;
    --accent: #8ab4ff; --accent2: #b48aff; --ok: #52e08a; --warn: #fbbf24;
    --glow: rgba(138,180,255,.10);
    --mono: ui-monospace, 'Cascadia Code', 'Cascadia Mono', Consolas, 'SF Mono', monospace;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--ink);
    font: 15px/1.65 system-ui, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    background:
      radial-gradient(900px 480px at 50% -260px, var(--glow), transparent 72%),
      var(--bg);
    background-attachment: fixed;
  }
  /* faint dot-grid, fixed so it reads as material not content */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,.021) 1px, transparent 0);
    background-size: 24px 24px;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, transparent 900px);
            mask-image: linear-gradient(180deg, #000 0%, transparent 900px);
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }
  ::selection { background: rgba(138,180,255,.24); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* ── header ─────────────────────────────────────────────── */
  .top { border-bottom: 1px solid var(--line); background: rgba(9,10,14,.72);
         backdrop-filter: blur(12px) saturate(1.4); position: sticky; top: 0; z-index: 20; }
  .top-in { max-width: 1000px; margin: 0 auto; padding: 13px 24px;
            display: flex; align-items: center; gap: 14px; }
  .wordmark { display: inline-flex; align-items: baseline; gap: 9px;
              font-family: var(--mono); font-size: 16px; font-weight: 700;
              letter-spacing: 4px; color: var(--ink); }
  .wordmark:hover { text-decoration: none; }
  .wordmark .star { color: var(--accent2); letter-spacing: 0; font-size: 15px;
                    text-shadow: 0 0 14px rgba(180,138,255,.6); }
  .tagline { font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.5px;
             text-transform: uppercase; color: var(--faint); border: 1px solid var(--line);
             border-radius: 5px; padding: 2px 7px; }
  .top nav { margin-left: auto; display: flex; gap: 4px; }
  .top nav a { color: var(--dim); font-size: 13px; padding: 6px 11px; border-radius: 7px;
               transition: color .14s, background .14s; }
  .top nav a:hover { color: var(--ink); background: var(--card); text-decoration: none; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 46px 24px 110px; }

  /* ── shared atoms ───────────────────────────────────────── */
  .chip { display: inline-flex; align-items: center; gap: 5px; background: var(--card);
          border: 1px solid var(--line); border-radius: 7px; padding: 3px 9px;
          font-size: 11.5px; color: var(--dim); font-family: var(--mono);
          white-space: nowrap; letter-spacing: .2px; }
  .chip b { color: var(--ink); font-weight: 600; }
  .chip.warn { border-color: rgba(251,191,36,.4); color: var(--warn); background: rgba(251,191,36,.06); }

  kbd { font-family: var(--mono); font-size: 11px; color: var(--dim); background: var(--card2);
        border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px;
        padding: 1px 6px; line-height: 1.4; }

  .eyebrow { font-family: var(--mono); font-size: 11.5px; letter-spacing: 2.5px;
             text-transform: uppercase; color: var(--faint); display: inline-flex;
             align-items: center; gap: 8px; }
  .eyebrow .star { color: var(--accent2); }

  /* ── the terminal — astra's signature object ────────────── */
  .term { border: 1px solid var(--line2); border-radius: 11px; overflow: hidden;
          background: #04050a;
          box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 12px 34px rgba(0,0,0,.42); }
  .term-bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px 9px 14px;
              border-bottom: 1px solid rgba(255,255,255,.06);
              background: linear-gradient(180deg, rgba(255,255,255,.03), transparent); }
  .term-bar .shell { font-family: var(--mono); font-size: 11px; letter-spacing: 1.4px;
                     text-transform: uppercase; color: var(--faint); }
  .term-bar .copy { margin-left: auto; }
  .term-body { display: flex; gap: 12px; padding: 15px 16px; align-items: baseline;
               font-family: var(--mono); font-size: 12.5px; line-height: 1.6;
               overflow-x: auto; scrollbar-width: thin; }
  .term-body .prompt { color: var(--accent2); font-weight: 700; user-select: none; flex: none; }
  .term-body .code { color: var(--ok); white-space: nowrap; }

  button.copy { background: var(--card2); color: var(--dim); border: 1px solid var(--line2);
                border-radius: 7px; padding: 5px 13px; font-weight: 600; cursor: pointer;
                font-size: 12px; font-family: var(--mono); letter-spacing: .3px;
                transition: background .14s, color .14s, border-color .14s; }
  button.copy:hover { background: var(--accent); color: #06121f; border-color: var(--accent); }
  button.copy.done { color: var(--ok); border-color: rgba(82,224,138,.5); }

  .footer { border-top: 1px solid var(--line); margin-top: 90px; }
  .footer-in { max-width: 1000px; margin: 0 auto; padding: 26px 24px;
               font-size: 12px; color: var(--faint); font-family: var(--mono);
               display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
  .footer-in .star { color: var(--accent2); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto; } }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="wordmark" href="/"><span class="star">✦</span>ASTRA</a>
    <span class="tagline">skill registry</span>
    <nav>
      <a href="/">skills</a>
      <a href="/api/skills">api</a>
      <a href="/skills/astra-publish/latest">publish</a>
    </nav>
  </div>
</header>

<div class="wrap">
{% block content %}{% endblock %}
</div>

<footer class="footer">
  <div class="footer-in">
    <span><span class="star">✦</span> astra — agent skill transfer &amp; registry</span>
    <span>curated · versioned · no git required</span>
  </div>
</footer>
<script>
function copyText(btn, id) {
  navigator.clipboard.writeText(document.getElementById(id).textContent.trim()).then(() => {
    const old = btn.textContent;
    btn.textContent = 'copied ✓'; btn.classList.add('done');
    setTimeout(() => { btn.textContent = old; btn.classList.remove('done'); }, 1600);
  });
}
{% block script %}{% endblock %}
</script>
</body>
</html>
